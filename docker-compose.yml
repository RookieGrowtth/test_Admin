services:
  ai-testhub:
    build: .
    container_name: ai-testhub
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      APP_SECRET: ${APP_SECRET:-change-this-to-a-long-random-secret-at-least-32-characters}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - ai-testhub-data:/app/data
    restart: unless-stopped

volumes:
  ai-testhub-data:
